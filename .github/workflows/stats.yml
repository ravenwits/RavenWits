name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/*.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check card calculations
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate contribution and language cards
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
          TZ: Europe/Vilnius
        run: |
          test -n "$GH_TOKEN" || { echo "PAT secret is required"; exit 1; }
          python3 scripts/profile_cards.py
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update profile contribution cards"
          git push
