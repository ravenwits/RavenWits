<svg xmlns="http://www.w3.org/2000/svg" width="500" height="344" viewBox="0 0 500 344" role="img" aria-labelledby="title desc"><title id="title">Languages in contributed repositories</title><desc id="desc">Language distribution by code bytes in accessible personal and organization repositories. Not a measure of personally authored code.</desc><style>text{font-family:Segoe UI,Ubuntu,Arial,sans-serif}</style><rect x=".5" y=".5" width="499" height="343" rx="8" fill="#1e1e2e" stroke="#585b70"/><text x="24" y="34" font-size="19" fill="#94e2d5" font-weight="600">Languages in contributed repositories</text><text x="24" y="60" font-size="12" fill="#a6adc8" font-weight="400">Repositories contributed to in the last 12 months</text><text x="24" y="90" font-size="14" fill="#cdd6f4" font-weight="400">TypeScript</text><text x="407" y="90" font-size="14" fill="#cdd6f4" font-weight="400">67.1%</text><rect x="195" y="80" width="120.82" height="9" rx="3" fill="#3178c6"/><text x="24" y="117" font-size="14" fill="#cdd6f4" font-weight="400">Lua</text><text x="407" y="117" font-size="14" fill="#cdd6f4" font-weight="400">21.5%</text><rect x="195" y="107" width="38.74" height="9" rx="3" fill="#000080"/><text x="24" y="144" font-size="14" fill="#cdd6f4" font-weight="400">JavaScript</text><text x="407" y="144" font-size="14" fill="#cdd6f4" font-weight="400">7.3%</text><rect x="195" y="134" width="13.19" height="9" rx="3" fill="#f1e05a"/><text x="24" y="171" font-size="14" fill="#cdd6f4" font-weight="400">Astro</text><text x="407" y="171" font-size="14" fill="#cdd6f4" font-weight="400">1.3%</text><rect x="195" y="161" width="2.41" height="9" rx="3" fill="#ff5a03"/><text x="24" y="198" font-size="14" fill="#cdd6f4" font-weight="400">ANTLR</text><text x="407" y="198" font-size="14" fill="#cdd6f4" font-weight="400">1.2%</text><rect x="195" y="188" width="2.24" height="9" rx="3" fill="#9DC3FF"/><text x="24" y="225" font-size="14" fill="#cdd6f4" font-weight="400">Python</text><text x="407" y="225" font-size="14" fill="#cdd6f4" font-weight="400">0.5%</text><rect x="195" y="215" width="1.00" height="9" rx="3" fill="#3572A5"/><text x="24" y="252" font-size="14" fill="#cdd6f4" font-weight="400">Other</text><text x="407" y="252" font-size="14" fill="#cdd6f4" font-weight="400">1.0%</text><rect x="195" y="242" width="1.75" height="9" rx="3" fill="#a6adc8"/><text x="24" y="279" font-size="12" fill="#a6adc8" font-weight="400">39 accessible repositories · 25 organization repositories</text><text x="24" y="301" font-size="12" fill="#a6adc8" font-weight="400">Share of repository code bytes, not code authored by me.</text><text x="24" y="323" font-size="12" fill="#a6adc8" font-weight="400">Private repositories require token access. Forks are included.</text></svg>
